<!doctype html>
<html lang="ru">
<head>

<title>Регистрация — телефон</title>

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F7}
.ui{color-scheme:light;
--ui-bg:#F4F5F7;--ui-surface:#FFFFFF;--ui-surface-soft:#EEF0F3;
--ui-text:#111318;--ui-text-secondary:#50576A;--ui-text-muted:#6B7282;
--ui-border:#E1E4EA;--ui-border-hover:#C9CED8;
--ui-primary:#3A5BD9;--ui-primary-hover:#2E4BC0;--ui-primary-soft:#EAEFFE;--ui-on-primary:#FFFFFF;
--ui-danger:#C62F22;--ui-danger-bg:#FDEEEC;--ui-success:#15803D;--ui-success-bg:#E9F8EF;
--ui-warning:#A65308;--ui-warning-bg:#FFF4E5;--ui-info:#1D5FC9;--ui-info-bg:#EAF3FF;
--ui-radius-sm:8px;--ui-radius:12px;--ui-radius-lg:16px;
--ui-shadow-sm:0 1px 2px rgba(16,24,40,.05);--ui-shadow-md:0 8px 24px rgba(16,24,40,.08);
font-family:'Onest',system-ui,sans-serif;color:var(--ui-text);background:var(--ui-bg)}
.ui.dark{color-scheme:dark;
--ui-bg:#0D0F13;--ui-surface:#15181E;--ui-surface-soft:#1C2027;
--ui-text:#ECEEF2;--ui-text-secondary:#A9B0BE;--ui-text-muted:#8A92A2;
--ui-border:#262A33;--ui-border-hover:#343A45;
--ui-primary:#7B93FF;--ui-primary-hover:#94A7FF;--ui-primary-soft:rgba(123,147,255,.14);--ui-on-primary:#0D0F13;
--ui-danger:#F97066;--ui-danger-bg:rgba(249,112,102,.12);--ui-success:#4ADE80;--ui-success-bg:rgba(74,222,128,.12);
--ui-warning:#FBBF24;--ui-warning-bg:rgba(251,191,36,.12);--ui-info:#60A5FA;--ui-info-bg:rgba(96,165,250,.12);
--ui-shadow-sm:none;--ui-shadow-md:0 8px 24px rgba(0,0,0,.45)}
a{color:var(--ui-primary);text-decoration:none}a:hover{color:var(--ui-primary-hover)}
button{font-family:inherit}

.ui{--hue-blue:#2F5BD3;--hue-blue-bg:#E8EEFD;--hue-sky:#0369A1;--hue-sky-bg:#E0F2FE;--hue-violet:#6D3FC9;--hue-violet-bg:#F0EAFD;
--hue-green:#15803D;--hue-green-bg:#E6F6EC;--hue-amber:#A15C07;--hue-amber-bg:#FEF3E2;--hue-rose:#BE123C;--hue-rose-bg:#FDE8EE;
--hue-teal:#0F766E;--hue-teal-bg:#E0F5F2;--hue-orange:#C2410C;--hue-orange-bg:#FFEDE3}
.ui.dark{--hue-blue:#8AA2FF;--hue-blue-bg:rgba(138,162,255,.14);--hue-sky:#7DD3FC;--hue-sky-bg:rgba(125,211,252,.12);--hue-violet:#B79BFF;--hue-violet-bg:rgba(183,155,255,.14);
--hue-green:#6EE7A0;--hue-green-bg:rgba(110,231,160,.12);--hue-amber:#FCC96B;--hue-amber-bg:rgba(252,201,107,.12);--hue-rose:#FB8FA8;--hue-rose-bg:rgba(251,143,168,.12);
--hue-teal:#5EEAD4;--hue-teal-bg:rgba(94,234,212,.12);--hue-orange:#FDA274;--hue-orange-bg:rgba(253,162,116,.12)}
</style>
</head>
<body>
<div class="ui" style="width: 390px; height: 900px; box-sizing: border-box; overflow: hidden; background: var(--ui-bg); color: var(--ui-text); font-family: 'Onest', system-ui, sans-serif; "><div style="display: flex; flex-direction: column; width: 390px; height: 900px; padding: 20px 20px 32px; box-sizing: border-box; gap: 36px;"><div style="display: flex; align-items: center; justify-content: space-between; padding-top: 24px;"><div style="display: flex; align-items: center; gap: 10px;"><div style="width: 32px; height: 32px; border-radius: 9px; background: var(--ui-primary); color: var(--ui-on-primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18 12 5l8 13"></path><path d="M8 13h8"></path></svg></div><span style="font-size: 16px; font-weight: 700;">[Название]</span></div><div style="display: flex; padding: 3px; gap: 2px; border-radius: 8px; background: var(--ui-surface-soft);"><button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--ui-surface); color: var(--ui-text); box-shadow: var(--ui-shadow-sm);">RU</button><button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: var(--ui-text-secondary);">UZ</button><button type="button" style="height: 32px; padding: 0 10px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: transparent; color: var(--ui-text-secondary);">EN</button></div></div><div style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 24px;"><div style="display: flex; flex-direction: column; gap: 8px;"><h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em;">Создайте аккаунт</h1><p style="margin: 0; font-size: 15px; color: var(--ui-text-secondary); line-height: 1.5;">Бесплатно. Займёт меньше минуты.</p></div><form style="display: flex; flex-direction: column; gap: 16px; margin: 0;"><label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 14px; font-weight: 500;">Имя</span><span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--ui-border); border-radius: var(--ui-radius-sm); background: var(--ui-surface);"><span style="color: var(--ui-text-muted); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span><input type="text" placeholder="Как к вам обращаться" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: var(--ui-text);"></span></label><label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 14px; font-weight: 500;">E-mail</span><span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--ui-border); border-radius: var(--ui-radius-sm); background: var(--ui-surface);"><span style="color: var(--ui-text-muted); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 6L2 7"></path></svg></span><input type="email" placeholder="name@company.uz" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: var(--ui-text);"></span></label><label style="display: flex; flex-direction: column; gap: 6px;"><span style="font-size: 14px; font-weight: 500;">Пароль</span><span style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--ui-border); border-radius: var(--ui-radius-sm); background: var(--ui-surface);"><span style="color: var(--ui-text-muted); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span><input type="password" placeholder="Минимум 8 символов" value="Lorem-2026!" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: var(--ui-text);"><button type="button" aria-label="Показать пароль" style="width: 32px; height: 32px; border: none; background: transparent; color: var(--ui-text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; margin-right: -6px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label><div style="display: flex; flex-direction: column; gap: 6px; margin-top: -8px;"><div style="display: flex; gap: 4px;"><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--ui-success);"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--ui-success);"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--ui-success);"></span><span style="flex: 1; height: 4px; border-radius: 2px; background: var(--ui-surface-soft);"></span></div><span style="font-size: 12.5px; color: var(--ui-success); font-weight: 600;">Надёжный пароль</span></div><label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.45; cursor: pointer;"><input type="checkbox" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--ui-primary); flex-shrink: 0;"><span>Принимаю <a href="#" style="font-weight: 600;">условия использования</a> и <a href="#" style="font-weight: 600;">политику конфиденциальности</a></span></label><button type="button" style="background: var(--ui-primary); color: var(--ui-on-primary); border: 1px solid var(--ui-primary); height: 52px; padding: 0 20px; border-radius: var(--ui-radius-sm); font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; box-sizing: border-box; width: 100%;">Создать аккаунт</button></form><p style="margin: 0; font-size: 14px; color: var(--ui-text-secondary); text-align: center;">Уже есть аккаунт? <a href="#" style="font-weight: 600;">Войти</a></p></div></div></div>
</body>
